<div class="tag-chart">
	<p-chart type="line" [data]="chartData" class="h-[30rem]" class="chart" (onDataSelect)="dataSelected($event)"/>
	<div class="tag-toggle-list">
		<button type="button" class="tag-toggle" *ngFor="let tagName of chartTags"
						[class.active]="selectedTags[tagName]" (click)="toggleTag(tagName)">
			<fa-icon class="tag-toggle-check" [icon]="checkIcon" *ngIf="selectedTags[tagName]"></fa-icon>
			{{tagName}}
		</button>
	</div>
</div>
