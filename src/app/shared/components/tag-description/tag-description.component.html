<div class="tag-description">
	<div class="tag-description-intro">
		<h3>Classificar tags</h3>
		<p>Classifique cada tag pelo comportamento do gasto. Tags da mesma categoria aparecem juntas no relatório.</p>
	</div>

	<table class="table table-hover category-legend">
		<thead>
			<tr>
				<th>Categoria</th>
				<th>O que é</th>
				<th>Exemplo</th>
			</tr>
		</thead>
		<tbody>
			<tr *ngFor="let category of categories">
				<td class="category-name">{{category.name}}</td>
				<td>{{category.meaning}}</td>
				<td class="category-examples">{{category.examples}}</td>
			</tr>
		</tbody>
	</table>

	<table class="table table-hover">
		<thead>
			<tr>
				<th>Tag</th>
				<th>Categoria</th>
			</tr>
		</thead>
		<tbody>
			<tr *ngFor="let tag of tags()">
				<td>{{tag.name}}</td>
				<td>
					<ng-select [items]="categoryNames"
	                    [(ngModel)]="tag.description"
	                    addTag="true"
	                    addTagText="Criar categoria"
	                    [clearable]="true"
	                    notFoundText="Nenhuma categoria encontrada"
	                    placeholder="Fixa, Variável, Esporádica..."
	                    (change)="valueChanged($event)">
	        </ng-select>
				</td>
			</tr>
		</tbody>
	</table>

	<div class="button-container">
		<button class="btn btn-md btn-primary" (click)="send()">Salvar</button> &nbsp; &nbsp; &nbsp;
		<button class="btn btn-md btn-secondary" (click)="next()">Prosseguir</button> &nbsp; &nbsp; &nbsp;
	</div>
</div>
