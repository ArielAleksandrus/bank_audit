<div class="dp-container">
	<h4>Selecione o período</h4>
	<p class="dp-hint" *ngIf="!fromDate">Toque em um dia, ou em dois para um intervalo.</p>
	<p class="dp-hint" *ngIf="fromDate && !toDate">{{formatDate(fromDate)}} — toque em outro dia para o fim, ou pesquise só este dia.</p>
	<p class="dp-hint dp-hint-range" *ngIf="fromDate && toDate">{{formatDate(fromDate)}} até {{formatDate(toDate)}}</p>

	<ngb-datepicker [displayMonths]="displayMonths"
									[dayTemplate]="dayTemplate"
									[weekdays]="'short'"
									outsideDays="hidden"
									(dateSelect)="onDateSelection($event)"/>
	<div class="footer-buttons">
		<button type="button" class="dp-btn dp-btn-ghost" (click)="cancel.emit()">Voltar</button>
		<button type="button" class="dp-btn dp-btn-solid" (click)="onConfirm()" [disabled]="!fromDate">Pesquisar</button>
	</div>
</div>

<ng-template #dayTemplate let-date let-focused="focused">
	<span
		class="custom-day"
		[class.focused]="focused"
		[class.range]="isRange(date)"
		[class.faded]="isHovered(date) || isInside(date)"
		(mouseenter)="hoveredDate = date"
		(mouseleave)="hoveredDate = null"
	>
		{{ date.day }}
	</span>
</ng-template>
